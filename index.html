<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<title>Mapa 3D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" crossorigin="anonymous">
<style>
:root {
  --bg-app: #0b0d10;
  --glass-bg: rgba(22, 27, 34, 0.85);
  --glass-bg-heavy: rgba(15, 19, 24, 0.95);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-border-active: rgba(255, 255, 255, 0.15);
  --accent: #10b981;
  --accent-hover: #059669;
  --accent-glow: rgba(16, 185, 129, 0.3);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --danger: #ef4444;
  --warning: #f59e0b;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.4);
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; height: 100%;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 15px; line-height: 1.4;
  overflow: hidden; color: var(--text-primary);
  background: var(--bg-app);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#map { position: absolute; inset: 0; background: #1a202c; z-index: 1; }

.b {
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  font-family: 'Inter', sans-serif;
  font-weight: 600; font-size: 14px;
  color: var(--text-primary);
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  white-space: nowrap; cursor: pointer;
  transition: var(--transition);
  box-shadow: var(--shadow-sm); outline: none;
}
.b:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--glass-border-active);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.b:active { transform: translateY(0) scale(0.97); }
.b.on, .go {
  background: var(--accent); color: #022c22;
  border-color: var(--accent);
  box-shadow: 0 4px 12px var(--accent-glow);
}
.b.on:hover, .go:hover {
  background: var(--accent-hover); border-color: var(--accent-hover); color: #fff;
}

#bar {
  position: absolute; top: env(safe-area-inset-top, 12px);
  left: 12px; right: 12px; z-index: 5;
  display: flex; gap: 8px; padding: 8px;
  overflow-x: auto; scrollbar-width: none;
}
#bar::-webkit-scrollbar { display: none; }

.pn {
  position: absolute; z-index: 10;
  background: var(--glass-bg-heavy);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  display: none;
  animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

#lm, #om {
  z-index: 11; top: calc(64px + env(safe-area-inset-top, 0));
  left: 12px; border-radius: var(--radius-lg);
  padding: 8px; flex-direction: column; min-width: 200px;
  max-height: 75vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.2) transparent;
}
#om::-webkit-scrollbar { width: 6px; }
#om::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
#om { left: auto; right: 12px; width: min(88vw, 320px); }

#lm .b, #om .b {
  background: transparent; border: none; text-align: left;
  box-shadow: none; white-space: normal;
  padding: 10px 12px; border-radius: var(--radius-sm);
  font-weight: 500; color: var(--text-secondary);
}
#lm .b:hover, #om .b:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary); transform: none;
}

#om .row {
  padding: 12px; display: flex; gap: 12px;
  align-items: center; flex-wrap: wrap;
  border-top: 1px solid var(--glass-border); margin-top: 4px;
}
#om select {
  font-family: inherit; font-size: 14px;
  padding: 8px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: rgba(0, 0, 0, 0.3); color: var(--text-primary);
  outline: none; cursor: pointer; transition: var(--transition);
}
#om select:focus { border-color: var(--accent); }
#om option { background: #1e232b; color: var(--text-primary); }
#om .mailText {
  color: #60a5fa; font-weight: 600; text-decoration: none;
  transition: var(--transition);
}
#om .mailText:hover { color: #93c5fd; }

#cmp {
  position: absolute; right: 12px;
  top: calc(64px + env(safe-area-inset-top, 0));
  z-index: 5; width: 56px; padding: 8px 0;
  border-radius: var(--radius-lg);
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  text-align: center; font-weight: 600; font-size: 11px;
  letter-spacing: 0.5px; box-sizing: border-box;
  cursor: pointer; transition: var(--transition);
  box-shadow: var(--shadow-md);
}
#cmp:hover { transform: scale(1.05); border-color: var(--glass-border-active); }
#cmp svg {
  width: 36px; height: 36px; display: block; margin: 0 auto 4px;
  transition: transform 0.1s linear;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}
#cmp b { display: block; font-size: 10px; letter-spacing: 0.5px; color: var(--text-secondary); }
#cmp.on {
  background: var(--accent); border-color: var(--accent);
  color: #022c22; box-shadow: 0 4px 16px var(--accent-glow);
}
#cmp.on b { color: #064e3b; }

#selArrow {
  position: absolute; left: 12px;
  top: calc(64px + env(safe-area-inset-top, 0));
  z-index: 6; width: 48px; height: 48px; display: none;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: 50%; backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-sizing: border-box; padding: 6px;
  box-shadow: var(--shadow-md); transition: var(--transition);
}
#selArrow.on {
  display: block; background: var(--accent);
  border-color: var(--accent); box-shadow: 0 4px 16px var(--accent-glow);
}
#selArrow svg { width: 100%; height: 100%; display: block; }
#selArrowPath {
  transform-box: fill-box; transform-origin: center;
  transition: transform 0.15s linear; fill: #022c22;
}

#mode {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(64px + env(safe-area-inset-top, 0)); z-index: 5;
  padding: 8px 18px; border-radius: 999px;
  font-weight: 700; font-size: 12px; letter-spacing: 0.5px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: none; white-space: nowrap;
  box-shadow: var(--shadow-md); color: var(--text-secondary);
}
#mode.a {
  background: var(--accent); color: #022c22;
  border-color: var(--accent); box-shadow: 0 4px 16px var(--accent-glow);
}

#turn {
  left: 50%; transform: translateX(-50%);
  top: calc(64px + env(safe-area-inset-top, 0));
  width: min(92vw, 380px); border-radius: var(--radius-lg);
  padding: 14px 18px; display: none;
  flex-direction: row; align-items: center; gap: 16px;
  border: 1px solid var(--glass-border); box-shadow: var(--shadow-lg);
}
#turn.show { display: flex; animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
#ta { font-size: 36px; line-height: 1; flex: 0 0 auto; color: var(--accent); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
#td { font-weight: 700; font-size: 22px; color: var(--text-primary); }
#tt { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }
#turn .spdbox {
  margin-left: auto; flex: 0 0 auto; text-align: center;
  padding: 8px 12px; border-radius: var(--radius-md);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--glass-border); min-width: 72px;
  transition: var(--transition);
}
#turn .spdbox small {
  display: block; font-weight: 600; font-size: 10px;
  color: var(--text-secondary); letter-spacing: 0.5px; text-transform: uppercase;
}
#turn .spdbox b {
  display: block; font-weight: 700; font-size: 22px; line-height: 1; color: var(--text-primary);
}
#turn .spdbox.hi {
  background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: var(--danger);
}
#turn .spdbox.hi b { color: var(--danger); }
#turn .spdbox.hi small { color: #fca5a5; }
#spd { display: none !important; }

#nav {
  left: 12px; right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0));
  padding: 16px 20px; border-radius: var(--radius-xl);
  border: 1px solid var(--glass-border); box-shadow: var(--shadow-lg);
  z-index: 10;
}
#eta { font-weight: 700; font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
#eta i { opacity: 0.6; font-style: normal; font-size: 16px; font-weight: 500; }
#sub { font-size: 15px; color: var(--text-secondary); margin-top: 4px; }
#nb { display: flex; gap: 10px; margin-top: 14px; }
#nb .b { flex: 1; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); }
#nb .b:hover { background: rgba(255, 255, 255, 0.12); }
#nb .go { background: var(--accent); border-color: var(--accent); }

#list {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  max-height: 60vh;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0);
  border: 1px solid var(--glass-border); border-bottom: none;
  flex-direction: column;
  z-index: 10;
  background: var(--glass-bg-heavy);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
#hd {
  flex-shrink: 0;
  display: flex; gap: 10px;
  padding: 16px;
  border-bottom: 1px solid var(--glass-border);
}
#q {
  flex: 1; min-width: 0; padding: 12px 16px;
  font-family: inherit; font-size: 15px; color: var(--text-primary);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--glass-border); border-radius: var(--radius-md);
  outline: none; transition: var(--transition);
}
#q::placeholder { color: var(--text-secondary); }
#q:focus {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
}
#items {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.2) transparent;
}
#items::-webkit-scrollbar { width: 6px; }
#items::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

.i {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-top: 1px solid var(--glass-border);
  cursor: pointer; transition: var(--transition); background: transparent;
}
.i:hover { background: rgba(255, 255, 255, 0.05); }
.i .l {
  flex: 1; min-width: 0; overflow: hidden;
  font-weight: 600; font-size: 15px; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.i small {
  display: block; font-size: 13px; color: var(--text-secondary);
  margin-top: 3px; font-weight: 400;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.i .k {
  font-weight: 600; font-size: 14px; color: var(--text-primary);
  white-space: nowrap; min-width: 60px; text-align: right;
}
.i .a {
  white-space: nowrap; min-width: 70px; text-align: right;
  font-size: 13px; color: var(--text-secondary); font-weight: 500;
}

#msg {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(100px + env(safe-area-inset-top, 0)); z-index: 20;
  background: var(--glass-bg-heavy); border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding: 12px 20px; border-radius: var(--radius-md);
  display: none; box-shadow: var(--shadow-lg);
  font-weight: 500; font-size: 14px; color: var(--text-primary);
  text-align: center; max-width: 90vw;
  animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.lb {
  font-weight: 600; font-size: 12px; color: var(--text-primary);
  text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 4px rgba(0,0,0,0.6);
  white-space: nowrap; pointer-events: none;
  background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px;
}

.maplibregl-popup-content {
  color: var(--text-primary); background: var(--glass-bg-heavy);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
  max-width: 280px; padding: 16px 20px; box-shadow: var(--shadow-lg);
  font-family: 'Inter', sans-serif;
}
.maplibregl-popup-tip {
  border-top-color: var(--glass-bg-heavy) !important;
  border-bottom-color: var(--glass-bg-heavy) !important;
}
.maplibregl-popup-close-button {
  font-size: 28px; width: 36px; height: 36px; line-height: 36px;
  color: var(--text-secondary); right: 4px; top: 4px;
  border-radius: 50%; transition: var(--transition);
}
.maplibregl-popup-close-button:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
.maplibregl-popup-content .go, .maplibregl-popup-content .visit {
  margin-top: 12px; width: 100%; border: none;
  border-radius: var(--radius-sm); padding: 10px;
  font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
  cursor: pointer; transition: var(--transition);
}
.maplibregl-popup-content .go { background: var(--accent); color: #022c22; }
.maplibregl-popup-content .go:hover { background: var(--accent-hover); }
.maplibregl-popup-content .visit {
  background: rgba(239, 68, 68, 0.15); color: var(--danger);
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.maplibregl-popup-content .visit:hover { background: rgba(239, 68, 68, 0.25); }
.maplibregl-popup-content .visit.done {
  background: rgba(16, 185, 129, 0.15); color: var(--accent);
  border: 1px solid rgba(16, 185, 129, 0.3);
}
.maplibregl-popup-content .visit.done:hover { background: rgba(16, 185, 129, 0.25); }

#colorDlg, #errHistDlg {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); z-index: 20;
  background: var(--glass-bg-heavy); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); border-radius: var(--radius-xl);
  padding: 24px; display: none; width: min(90vw, 380px);
  box-sizing: border-box; box-shadow: var(--shadow-lg);
  animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
#errHistDlg { width: min(92vw, 440px); max-height: 80vh; }
#errHistDlg.on { display: block; }
@keyframes modalIn {
  from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
#colorDlg h3, #errHistDlg h3 {
  margin: 0 0 16px; font-size: 18px; font-weight: 700; color: var(--text-primary);
}
#colorDlg label {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; gap: 12px; font-size: 14px; color: var(--text-secondary);
  border-bottom: 1px solid var(--glass-border);
}
#colorDlg label:last-of-type { border-bottom: none; }
#colorDlg input[type="color"] {
  width: 48px; height: 36px; border: 1px solid var(--glass-border);
  background: rgba(0,0,0,0.3); padding: 2px;
  border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
}
#colorDlg input[type="color"]:hover { border-color: var(--accent); }
#colorDlg .b, #errHistDlg .b { margin-top: 12px; width: 100%; text-align: center; }

#errHistList {
  max-height: 50vh; overflow-y: auto; background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--glass-border); border-radius: var(--radius-md);
  padding: 12px; margin-bottom: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12px; line-height: 1.5; scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.2) transparent;
}
#errHistList .errItem {
  padding: 8px; border-bottom: 1px solid var(--glass-border);
  color: var(--text-secondary); word-break: break-word;
}
#errHistList .errItem:last-child { border-bottom: 0; }
#errHistList .errTime {
  color: var(--warning); font-weight: 700; margin-right: 8px;
  display: inline-block; white-space: nowrap;
}
#errHistList .errEmpty {
  opacity: 0.6; text-align: center; padding: 24px;
  font-style: italic; color: var(--text-secondary);
}

#pitchPop {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  z-index: 15; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
  color: var(--text-primary); padding: 12px 24px; border-radius: var(--radius-lg);
  font-weight: 700; font-size: 20px; display: none; pointer-events: none;
  white-space: nowrap; border: 1px solid var(--glass-border); box-shadow: var(--shadow-lg);
}
#errToast {
  position: absolute; left: 50%; top: calc(100px + env(safe-area-inset-top, 0));
  transform: translateX(-50%); z-index: 20;
  background: rgba(245, 158, 11, 0.9); backdrop-filter: blur(8px);
  color: #000; padding: 12px 24px; border-radius: var(--radius-md);
  font-weight: 700; font-size: 14px; display: none; box-shadow: var(--shadow-lg);
  pointer-events: none; align-items: center; gap: 8px;
  border: 1px solid rgba(255,255,255,0.2);
}
#errToast.on { display: flex; animation: errPop 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes errPop {
  from { opacity: 0; transform: translateX(-50%) scale(0.9) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
}

.dotm, .conem { pointer-events: none; }
.pulse {
  position: absolute; left: -12px; top: -12px; width: 24px; height: 24px;
  border-radius: 50%; background: rgba(16, 185, 129, 0.4);
  animation: pl 1.6s ease-out infinite;
}
.dot {
  position: absolute; left: -10px; top: -10px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--accent); border: 3px solid #fff;
  box-sizing: border-box; box-shadow: 0 0 8px rgba(0,0,0,0.5);
}
.cone {
  position: absolute; left: -80px; top: -80px; width: 160px; height: 160px;
  border-radius: 50%;
  background: conic-gradient(from -32deg, rgba(16, 185, 129, 0.65) 0deg 64deg, transparent 64deg);
  -webkit-mask: radial-gradient(circle, #000 6%, transparent 70%);
  mask: radial-gradient(circle, #000 6%, transparent 70%);
}
@keyframes pl {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(4); opacity: 0; }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    });

    console.warn('Usando balizas de demostración (falló la carga de la API):', e);
    balizasData = [

      { type: 'Feature', properties: { nombre: 'Baliza Demo Alicante', provincia: 'Alicante' }, geometry: { type: 'Point', coordinates: [-0.490, 38.345] } },
      { type: 'Feature', properties: { nombre: 'Baliza Demo Castellón', provincia: 'Castellón' }, geometry: { type: 'Point', coordinates: [-0.033, 39.986] } }

  if (!opts.voice || !route || !me) return;
  const features = map.getSource('balizas')._data.features;
  for (const f of features) {
    const id = f.properties.nombre;
    if (announcedBalizas.has(id)) continue;
    const d = dist(me, f.geometry.coordinates);

      buzz([50, 50, 50]);

}

  if (p) p.value = c.pt; if (l) l.value = c.line; if (y) y.value = c.poly; if (d) d.style.display = 'block';
}
on('#colOk', async () => {
  opts.kmlColors = { pt: ($('#colPt') || {}).value, line: ($('#colLine') || {}).value, poly: ($('#colPoly') || {}).value };
  LS.set('opts', JSON.stringify(opts));

  if (map.getLayer('kml-line')) map.setPaintProperty('kml-line', 'line-color', opts.kmlColors.line);

async function readFile(f) {
  let txt;
  if (/\.kmz$/i.test(f.name)) {
    const z = await JSZip.loadAsync(f), k = Object.keys(z.files).find(n => /\.kml$/i.test(n));
    if (!k) throw new Error('El KMZ no contiene ningún KML');
    txt = await z.files[k].async('string');
  } else txt = await f.text();
  return parseKML(txt, f.name);
}
function parseKML(t, src) {
  t = t.slice(Math.max(0, t.indexOf('<')));
  const d = new DOMParser().parseFromString(t, 'text/xml'), out = [];
  if (d.getElementsByTagName('parsererror').length) throw new Error('KML no válido');
  const co = s => s.trim().split(/\s+/).map(p => p.split(',').map(Number)).filter(a => a.length >= 2 && !isNaN(a[0]) && !isNaN(a[1])).map(a => [a[0], a[1]]);
  for (const p of d.getElementsByTagName('Placemark')) {
    const g = n => { const e = p.getElementsByTagName(n)[0]; return e ? e.textContent.trim() : ''; };
    const txt = g('description').replace(/<\/(td|th|tr)>/gi, ' | ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(), ext = {};
    for (const e of p.getElementsByTagName('Data')) ext[e.getAttribute('name')] = ((e.getElementsByTagName('value')[0] || e).textContent || '').trim();
    for (const e of p.getElementsByTagName('SimpleData')) ext[e.getAttribute('name')] = e.textContent.trim();
    const ks = Object.keys(ext), k = ks.find(x => /uso.*sigpac|sigpac.*uso/i.test(x)) || ks.find(x => /^uso/i.test(x)),
      fld = (kr, tr) => { const kk = ks.find(x => kr.test(x)); if (kk) return ext[kk]; const mm = tr.exec(txt); return mm ? mm[1] : ''; };
    let uso = k ? ext[k] : ''; if (!uso) { const m = /uso[_ ]?sigpac[\s|:=]+([A-Za-z0-9ÁÉÍÓÚÑáéíóúñ]+)/i.exec(txt); if (m) uso = m[1]; }
    const props = { name: g('name') || '(sin nombre)', desc: (txt || ks.map(x => x + ': ' + ext[x]).join(' · ')).slice(0, 400), uso,
      grupo: fld(/grupo_?cult/i, /grupo[_ ]?cult\w*[\s|:=]+([A-Za-z]+)/i),
      pend: fld(/pdte|pend/i, /(?:pdte|pend)\w*[\s|:=]+(-?[\d.,]+)/i),
      sup: fld(/superf|has|ha\b|area/i, /(?:superf\w*|has|ha|area)[\s|:=]+([\d.,]+)/i),
      src }, gs = [];
    for (const e of p.getElementsByTagName('Point')) gs.push({ type: 'Point', coordinates: co(e.getElementsByTagName('coordinates')[0].textContent)[0] });
    for (const e of p.getElementsByTagName('LineString')) gs.push({ type: 'LineString', coordinates: co(e.getElementsByTagName('coordinates')[0].textContent) });
    for (const e of p.getElementsByTagName('Polygon')) gs.push({ type: 'Polygon', coordinates: [...e.getElementsByTagName('coordinates')].map(c => co(c.textContent)) });
    for (const e of p.getElementsByTagName('gx:Track')) {
      const cc = [...e.getElementsByTagName('gx:coord')].map(x => x.textContent.trim().split(/\s+/).map(Number)).filter(a => a.length >= 2 && !isNaN(a[0]) && !isNaN(a[1])).map(a => [a[0], a[1]]);
      if (cc.length > 1) gs.push({ type: 'LineString', coordinates: cc });
    }
    gs.filter(x => x.coordinates && x.coordinates.length).forEach(geometry => out.push({ type: 'Feature', properties: { ...props }, geometry }));
  }
  return out;
}
function fit(fs) {
  const b = new maplibregl.LngLatBounds(); fs.forEach(f => { if (f && f.geometry) flat(f.geometry.coordinates).forEach(c => b.extend(c)); });
  if (!b.isEmpty()) map.fitBounds(b, { padding: 80, maxZoom: 17, duration: 900 });
}
function save() {
  data.features.forEach((f, i) => { if (f) { if (!f.properties) f.properties = {}; f.properties.id = i; f.properties._isVisited = isVisited(f); } });
  const s = map.getSource('kml'); if (s) s.setData(data);
  if (!LS.set('kmz-data', JSON.stringify(data))) msg('No se pudo guardar en el dispositivo (demasiados datos)');
  labels();
  if (map.getLayer('kml-visit')) map.setFilter('kml-visit', ['all', ['==', ['geometry-type'], 'Polygon'], ['in', ['get', 'id'], ['literal', [...visited]]]]);
}
on('#bK', () => { const f = $('#fK'); if (f) f.click(); });
async function importKmzFiles(files) {
  let n = 0, bad = 0;
  for (const f of files) {
    try { const fs = await readFile(f); data.features.push(...fs); n += fs.length; fit(fs); } catch (err) { bad = 1; addError(f.name + ': ' + err.message); }
  }
  save(); render();
  if (n) msg(n + ' elementos importados'); else if (!bad) msg('No se encontraron puntos, líneas ni polígonos en el archivo');
}

function superficieOf(f) {
  const p = (f && f.properties) || {};
  if (p.sup) return p.sup;
  if (f && f.geometry && f.geometry.type === 'Polygon') {
    const ring = f.geometry.coordinates[0];
    let area = 0;
    for (let i = 0; i < ring.length - 1; i++) {
      const a = ring[i], b = ring[i + 1];
      area += (b[0] - a[0]) * R * (2 + Math.sin(a[1] * R) + Math.sin(b[1] * R));
    }
    area = Math.abs(area * 6371008 * 6371008 / 2);
    return area > 10000 ? (area / 10000).toLocaleString('es-ES', { maximumFractionDigits: 2 }) + ' ha' : Math.round(area).toLocaleString('es-ES') + ' m²';
  }
  return '';
}
function regadioOf(f) {
  const p = (f && f.properties) || {}, g = String(p.grupo || '').toUpperCase(), desc = String(p.desc || '').toLowerCase();
  if (g === 'TCR' || g === 'CP' && /regad/i.test(desc)) return 'Regadío';
  if (g === 'TCS') return 'Secano';
  if (/secano/i.test(desc)) return 'Secano';
  if (/regad/i.test(desc)) return 'Regadío';
  const u = String(p.uso || '').toUpperCase();
  if (['IV','TH','TA'].includes(u) && /regad/i.test(desc)) return 'Regadío';
  if (g) return GRUPO[g] ? (g === 'TCR' ? 'Regadío' : g === 'TCS' ? 'Secano' : '') : '';
  return '';
}
function render() {
  try {
    const qEl = $('#q'), box = $('#items'); if (!box) return;
    const q = (qEl && qEl.value || '').toLowerCase(); box.textContent = ''; rows = [];
    let fs = data.features || [];
    if (opts.listOnlyPts) fs = fs.filter(f => f && f.geometry && f.geometry.type === 'Point');
    fs = fs.filter(f => safeName(f).includes(q)).map(f => ({ f, d: me ? dist(me, ptOf(f)) : 0 }));
    if (me) fs.sort((a, b) => a.d - b.d);
    listSorted = !!me;
    if (originPoint && (!q || originPoint.name.toLowerCase().includes(q))) {
      const originFeature = {
        type: 'Feature',
        properties: { id: -1, name: '🏠 ' + originPoint.name, isOrigin: true },
        geometry: { type: 'Point', coordinates: [originPoint.lng, originPoint.lat] }
      };
      fs.unshift({ f: originFeature, d: me ? dist(me, [originPoint.lng, originPoint.lat]) : 0 });
    }
    fs.slice(0, 300).forEach(({ f }) => {
      const d = document.createElement('div'), l = document.createElement('div'), s = document.createElement('small'), k = document.createElement('div'), a = document.createElement('div');
      d.className = 'i'; l.className = 'l'; k.className = 'k'; a.className = 'a';
      d._feature = f;
      l.textContent = (f.properties && f.properties.name) || '(sin nombre)';
      const sup = superficieOf(f), pend = (f.properties && f.properties.pend) || '', reg = regadioOf(f);
      let info = f.properties && f.properties.isOrigin ? 'Punto de origen' : f.geometry.type;
      if (f.properties && f.properties.uso) info += ' · uso ' + f.properties.uso;
      if (sup) info += ' · ' + sup;
      if (pend) info += ' · pend. ' + String(pend).replace('.', ',') + '%';
      if (reg) info += ' · ' + reg;
      s.textContent = info;
      l.append(s);
      d.append(l, k, a);
      d.onclick = () => {
        if (f.properties && f.properties.isOrigin && originPoint) {
          map.easeTo({ center: [originPoint.lng, originPoint.lat], zoom: Math.max(map.getZoom(), 17), duration: 600 });
          closeList();
        } else {
          focusFeature(f); closeList();
        }
      };
      if (isVisited(f)) {
        d.style.background = '#2fb36b'; d.style.color = '#06210f';
      } else if (selectedFeature && selectedFeature.properties && f.properties && f.properties.id === selectedFeature.properties.id && f.geometry.type === selectedFeature.geometry.type) {
        d.style.background = '#10b981'; d.style.color = '#06210f';
      }
      box.append(d); rows.push({ f, k, a, el: d });
    });
    if (!rows.length) { const d = document.createElement('div'); d.className = 'i'; d.textContent = 'Sin puntos. Pulsa KMZ para importar.'; box.append(d); }
    upd();
  } catch (e) { addError('render: ' + e.message); }
}
function upd() {
  try {
    rows.forEach(r => {
      if (!me) { r.k.textContent = '—'; r.a.textContent = ''; return; }
      const c = ptOf(r.f), b = brg(me, c), ref = dev != null ? dev : speed > 1 ? car.hdg : 0;
      r.k.textContent = (dist(me, c) / 1000).toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + ' km';
      r.a.innerHTML = `<span style="display:inline-block;transform:rotate(${(b - ref).toFixed(0)}deg)">↑</span> ${Math.round(b)}° ${card(b)}`;
    });
  } catch (e) { addError('upd: ' + e.message); }
}
setInterval(() => { const l = $('#list'); if (l && l.style.display === 'flex') upd(); updSelArrow(); updSpeed(); }, 1000);
