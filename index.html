<script>
/* ---------- Instrumentación de errores visible ---------- */
window.addEventListener('error', e => {
  const m = document.getElementById('msg');
  if (m) { m.textContent = 'ERROR: ' + (e.message || 'desconocido') + (e.lineno ? ' (línea ' + e.lineno + ')' : ''); m.style.display = 'block'; }
  console.error('[Mapa3D]', e.error || e.message);
});

const $ = s => document.querySelector(s), R = Math.PI / 180;

/* ---------- on(): asigna un handler solo si el elemento existe; si no, reporta ---------- */
function on(sel, fn) {
  const el = document.querySelector(sel);
  if (!el) { msg('ERROR: no existe el elemento ' + sel); return null; }
  el.onclick = fn;
  return el;
}

const easeOut = t => 1 - Math.pow(1 - t, 3);
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set: (k, v) => { try { localStorage.setItem(k, v); return 1; } catch (e) { return 0; } } };
const EMPTY = { type: 'FeatureCollection', features: [] }, EXA = 1.5, CACHE = 'tiles-v1';
const TPL = {
  osm: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  pnoa: 'https://www.ign.es/wmts/pnoa-ma?request=GetTile&service=WMTS&version=1.0.0&layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&format=image/jpeg&TileMatrix={z}&TileRow={y}&TileCol={x}',
  esri: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  dem: 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png' };
const BASES = [{ id: 'osm', n: 'Mapa', a: '© OpenStreetMap' }, { id: 'pnoa', n: 'Ortofoto PNOA (IGN)', a: 'PNOA © IGN' }, { id: 'esri', n: 'Satélite Esri', a: '© Esri' }];
const tileUrl = (id, z, x, y) => TPL[id].replace(/\{z\}/g, z).replace(/\{x\}/g, x).replace(/\{y\}/g, y);
const USO = { AG: 'corrientes y superficies de agua', CA: 'viales', CF: 'asociación cítricos-frutales', CI: 'cítricos', CV: 'asociación cítricos-viñedo', ED: 'edificaciones', EP: 'elemento del paisaje', FL: 'frutos secos y olivar', FO: 'forestal', FS: 'frutos secos', FV: 'frutos secos y viñedo', FY: 'frutales', IM: 'improductivos', IV: 'invernaderos y cultivos bajo plástico', MT: 'matorral', OC: 'asociación olivar-cítricos', OV: 'olivar', PA: 'pasto con arbolado', PR: 'pasto arbustivo', PS: 'pastizal', TA: 'tierras arables', TH: 'huerta', VF: 'viñedo-frutal', VI: 'viñedo', VO: 'viñedo-olivar', ZU: 'zona urbana', ZV: 'zona censurada' };
const GRUPO = { TCS: 'tierras de cultivo de secano', TCR: 'tierras de cultivo de regadío', CP: 'cultivos permanentes', PP: 'pastos permanentes' };
(async () => {
  try { Object.assign(USO, JSON.parse(LS.get('usoJson') || '{}')); } catch (e) {}
  try {
    const j = await (await fetch('https://sigpac-hubcloud.es/codigossigpac/cod_uso_sigpac.json')).json(), o = {};
    j.codigos.forEach(x => { o[x.codigo] = String(x.descripcion).toLowerCase(); });
    Object.assign(USO, o); LS.set('usoJson', JSON.stringify(o));
  } catch (e) {}
})();
const ARW = { left: '←', right: '→', 'slight left': '↖', 'slight right': '↗', 'sharp left': '↙', 'sharp right': '↘', straight: '↑', uturn: '↶', rot: '↻', arrive: '⚑' };

let sel = LS.get('base'); if (!BASES.some(b => b.id === sel)) sel = 'pnoa';
let opts = { labels: true, voice: true, haptic: true, bld: true, r: 600, z: 17, icon: 'yellow', listOnlyPts: true };
try { Object.assign(opts, JSON.parse(LS.get('opts'))); } catch (e) {}
let data = { type: 'FeatureCollection', features: [] };
try { data = JSON.parse(LS.get('kmz-data')) || data; } catch (e) {}
if (data && Array.isArray(data.features)) {
  data.features.forEach((f, i) => {
    if (!f) return;
    if (!f.properties) f.properties = {};
    f.properties.id = i;
  });
}

/* ============================================================
   Variables globales (arriba para evitar TDZ en style.load)
   ============================================================ */
let is3d = false, follow = false, cmode = 'M', wid = null, me = null, tgt = null, route = null, sim = null, selF = null, prev3d = false, devS = null, openP = null, listSorted = false, pT = 62;
let speed = 0, raf = 0, last = 0, fixT = 0, camB = 0, camZ = 17, camP = 0, zT = 17.8, dev = null, job = null, rows = [], lbl = [], lt = 0, ac;
let selectedFeature = null, gpsMode = 'general';
let visited = new Set();
try { const v = JSON.parse(LS.get('visited') || '[]'); v.forEach(i => visited.add(i)); } catch (e) {}
let tOff = 0, d3busy = false;
const car = { lng: 0, lat: 0, hdg: 0, z: 0, on: false, show: false };

const dist = (a, b) => Math.hypot((b[0] - a[0]) * R * Math.cos((a[1] + b[1]) / 2 * R), (b[1] - a[1]) * R) * 6371008;
const brg = (a, b) => (Math.atan2((b[0] - a[0]) * Math.cos(a[1] * R), b[1] - a[1]) / R + 360) % 360;
const ang = (a, b, t) => a + (((b - a + 540) % 360) - 180) * t;
const flat = c => typeof c[0] === 'number' ? [c] : c.flatMap(flat);
const ptOf = f => { const c = flat(f.geometry.coordinates); return f.geometry.type === 'Point' ? c[0] : c[Math.floor(c.length / 2)]; };
const pip = (p, r) => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const a = r[i], b = r[j]; if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; };
const card = b => ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][Math.round(b / 45) % 8];
const btn = t => { const b = document.createElement('button'); b.className = 'b'; b.textContent = t; return b; };
const fmtD = m => m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' km';
const fmtT = s => { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
const hhmm = s => new Date(Date.now() + s * 1000).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
function msg(t) { const m = $('#msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(msg.t); msg.t = setTimeout(() => m.style.display = 'none', 4500); }
function speak(t) {
  if (!opts.voice || !window.speechSynthesis) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; speechSynthesis.speak(u);
}
function saveVisited() { LS.set('visited', JSON.stringify([...visited])); }
function safeName(f) { try { return String(f && f.properties && f.properties.name || '').toLowerCase(); } catch (e) { return ''; } }

/* ---------- Vibración y sonido ---------- */
function buzz(p) { if (opts.haptic && navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }
function tap() {
  if (!opts.haptic) return; buzz(12);
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 900; g.gain.value = 0.06;
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.03);
  } catch (e) {}
}
document.addEventListener('click', e => { if (e.target.closest('button,.i,#cmp')) tap(); }, true);

/* ---------- Caché de teselas ---------- */
maplibregl.addProtocol('ctile', async (p, c) => {
  const [, id, z, x, y] = p.url.match(/^ctile:\/\/(\w+)\/(\d+)\/(\d+)\/(\d+)/), u = tileUrl(id, z, x, y);
  let ca = null; try { ca = window.caches && await caches.open(CACHE); } catch (e) {}
  let r = ca && await ca.match(u);
  if (!r) {
    r = await fetch(u, { signal: c && c.signal }); if (!r.ok) throw new Error('HTTP ' + r.status);
    if (ca) ca.put(u, r.clone()).catch(() => {});
  }
  return { data: await r.arrayBuffer() };
});
const proto = new pmtiles.Protocol(); maplibregl.addProtocol('pmtiles', proto.tile);

function tileKeys(pts, specs, r) {
  const S = new Set();
  for (const p of pts) {
    const dLat = r / 110540, dLng = r / (111320 * Math.cos(p[1] * R));
    for (const [id, z0, z1] of specs) for (let z = z0; z <= z1; z++) {
      const n = 2 ** z, X = l => Math.floor((l + 180) / 360 * n), Y = a => Math.floor((1 - Math.log(Math.tan(a * R) + 1 / Math.cos(a * R)) / Math.PI) / 2 * n);
      for (let x = X(p[0] - dLng); x <= X(p[0] + dLng); x++) for (let y = Y(p[1] + dLat); y <= Y(p[1] - dLat); y++) S.add(id + '/' + z + '/' + x + '/' + y);
    }
  }
  return [...S];
}
const ROAD_W = 70;
function sampleLine(c, step) {
  const out = [c[0]]; let acc = 0;
  for (let i = 1; i < c.length; i++) {
    const a = c[i - 1], b = c[i], d = dist(a, b);
    for (let s = step - acc; s < d; s += step) out.push([a[0] + (b[0] - a[0]) * s / d, a[1] + (b[1] - a[1]) * s / d]);
    acc = (acc + d) % step;
  }
  out.push(c[c.length - 1]); return out;
}
async function fetchTiles(keys, onP, j) {
  const ca = await caches.open(CACHE); let i = 0, done = 0, fail = 0;
  const w = async () => {
    while (i < keys.length && !j.stop) {
      const [id, z, x, y] = keys[i++].split('/'), u = tileUrl(id, z, x, y);
      try { if (!(await ca.match(u))) { const r = await fetch(u); if (r.ok) await ca.put(u, r); else fail++; } } catch (e) { fail++; }
      done++; if (onP) onP(done, keys.length);
    }
  };
  await Promise.all([...Array(6)].map(w)); return fail;
}
async function dlZone() {
  if (job) { job.stop = true; return; }
  if (!window.caches) return msg('La caché de mapas solo funciona desde https o localhost');
  if (!TPL[sel]) return msg('La capa activa es un archivo offline: no hace falta descargarla');
  const lines = data.features.filter(f => f.geometry.type === 'LineString'), pts = data.features.filter(f => f.geometry.type !== 'LineString').map(ptOf);
  if (!pts.length && !lines.length) return msg('Importa primero un KMZ con puntos');
  const sp = [[sel, 12, +opts.z], ['dem', 11, 15]], r = +opts.r, kp = tileKeys(pts, sp, r);
  const kl = tileKeys(lines.flatMap(f => sampleLine(f.geometry.coordinates, 40)), sp, ROAD_W);

  const kc = opts.kmlColors || { pt: '#e5392f', line: '#ffd23f', poly: '#f2b01e' };
  if (map.getLayer('kml-pts')) map.setPaintProperty('kml-pts', 'circle-color', kc.pt);
  if (map.getLayer('kml-line')) map.setPaintProperty('kml-line', 'line-color', kc.line);
  if (map.getLayer('kml-fill')) map.setPaintProperty('kml-fill', 'fill-color', kc.poly);
  showColorDlg(files);
};
async function importKmzFiles(files) {
  let n = 0, bad = 0;
  for (const f of files) {
    try { const fs = await readFile(f); data.features.push(...fs); n += fs.length; fit(fs); } catch (err) { bad = 1; msg(f.name + ': ' + err.message); }
  }
  save(); render();
  if (n) msg(n + ' elementos importados'); else if (!bad) msg('No se encontraron puntos, líneas ni polígonos en el archivo');
}

function superficieOf(f) {
  const p = (f && f.properties) || {};
  if (p.sup) return p.sup;
  if (f && f.geometry && f.geometry.type === 'Polygon') {
    const ring = f.geometry.coordinates[0];
    let area = 0;
    for (let i = 0; i < ring.length - 1; i++) {
      const a = ring[i], b = ring[i + 1];
      area += (b[0] - a[0]) * R * (2 + Math.sin(a[1] * R) + Math.sin(b[1] * R));
    }
    area = Math.abs(area * 6371008 * 6371008 / 2);
    return area > 10000 ? (area / 10000).toLocaleString('es-ES', { maximumFractionDigits: 2 }) + ' ha' : Math.round(area).toLocaleString('es-ES') + ' m²';
  }
  return '';
}
function regadioOf(f) {
  const p = (f && f.properties) || {}, g = String(p.grupo || '').toUpperCase(), desc = String(p.desc || '').toLowerCase();
  if (g === 'TCR' || g === 'CP' && /regad/i.test(desc)) return 'Regadío';
  if (g === 'TCS') return 'Secano';
  if (/secano/i.test(desc)) return 'Secano';
  if (/regad/i.test(desc)) return 'Regadío';
  const u = String(p.uso || '').toUpperCase();
  if (['IV','TH','TA'].includes(u) && /regad/i.test(desc)) return 'Regadío';
  if (g) return GRUPO[g] ? (g === 'TCR' ? 'Regadío' : g === 'TCS' ? 'Secano' : '') : '';
  return '';
}
function render() {
  try {
    const q = ($('#q').value || '').toLowerCase(), box = $('#items'); box.textContent = ''; rows = [];
    let fs = data.features || [];
    if (opts.listOnlyPts) fs = fs.filter(f => f && f.geometry && f.geometry.type === 'Point');
    fs = fs.filter(f => safeName(f).includes(q)).map(f => ({ f, d: me ? dist(me, ptOf(f)) : 0 }));
    if (me) fs.sort((a, b) => a.d - b.d);
    listSorted = !!me;
    fs.slice(0, 300).forEach(({ f }) => {
      const d = document.createElement('div'), l = document.createElement('div'), s = document.createElement('small'), k = document.createElement('div'), a = document.createElement('div');
      d.className = 'i'; l.className = 'l'; k.className = 'k'; a.className = 'a';
      d._feature = f;
      l.textContent = (f.properties && f.properties.name) || '(sin nombre)';
      const sup = superficieOf(f), pend = (f.properties && f.properties.pend) || '', reg = regadioOf(f);
      let info = f.geometry.type;
      if (f.properties && f.properties.uso) info += ' · uso ' + f.properties.uso;
      if (sup) info += ' · ' + sup;
      if (pend) info += ' · pend. ' + String(pend).replace('.', ',') + '%';
      if (reg) info += ' · ' + reg;
      s.textContent = info;
      l.append(s);
      d.append(l, k, a);
      d.onclick = () => { focusFeature(f); closeList(); };
      if (selectedFeature && selectedFeature.properties && f.properties && f.properties.id === selectedFeature.properties.id && f.geometry.type === selectedFeature.geometry.type) {
        d.style.background = '#f5c518'; d.style.color = '#06210f';
      } else if (visited.has(f.properties.id)) {
        d.style.background = '#2fb36b'; d.style.color = '#06210f';
      }
      box.append(d); rows.push({ f, k, a, el: d });
    });
    if (!rows.length) { const d = document.createElement('div'); d.className = 'i'; d.textContent = 'Sin puntos. Pulsa KMZ para importar.'; box.append(d); }
    upd();
  } catch (e) { msg('render: ' + e.message); }
}
function upd() {
  try {
    rows.forEach(r => {
      if (!me) { r.k.textContent = '—'; r.a.textContent = ''; return; }
      const c = ptOf(r.f), b = brg(me, c), ref = dev != null ? dev : speed > 1 ? car.hdg : 0;
      r.k.textContent = (dist(me, c) / 1000).toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + ' km';
      r.a.innerHTML = `<span style="display:inline-block;transform:rotate(${(b - ref).toFixed(0)}deg)">↑</span> ${Math.round(b)}° ${card(b)}`;
    });
  } catch (e) { msg('upd: ' + e.message); }
}
setInterval(() => { if ($('#list').style.display === 'block') upd(); updSelArrow(); updSpeed(); }, 1000);
function closeList() { if (openP === 'list') panel('list'); }
on('#bL', () => panel('list'));
$('#q').oninput = render;

if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('portrait').catch(() => {}); }
